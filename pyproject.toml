[project]
name = "affdet"
version = "0.1.0"
description = "Learning-based affordance detection for TAMP — Bachelor thesis"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.26",
    "typer>=0.12",
    "pillow>=10.0",
    "tqdm>=4.0",
    "pyyaml>=6.0",
    # `affdet predict` needs all three: the detector, the frozen backbone and
    # the class probe. Keeping them optional made the headline command
    # uninstallable by default.
    "torch>=2.2",
    "ultralytics>=8.3",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
# Querying the VLM teacher to build new supervision (not needed for
# inference or for training on an existing corpus).
teacher = [
    "openai>=1.0",
]

[project.scripts]
affdet = "affdet.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["affdet"]

[tool.pytest.ini_options]
testpaths = ["affdet/tests"]
