<!--
  Scene-first labelling UI. Served by affdet/label/scene_tool.py.

  Blind by construction, same as manual_tool.html: /api/state never carries
  a VLM score or model prediction, do not add a fetch that joins them in.
  See tools/docs/labeling_protocol.md §2.
-->
<meta charset="utf-8">
<title>Scene labelling</title>
<style>
  :root {
    --actor: #2f6fd0;
    --recipient: #d2701c;
    --bg: #14161a;
    --panel: #1c1f25;
    --line: #2c313a;
    --text: #e8eaed;
    --dim: #9aa1ac;
    --done: #3aa96b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 10px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 16px; flex: none;
  }
  .count { font-variant-numeric: tabular-nums; color: var(--dim); white-space: nowrap; }
  .bar { flex: 1; height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--actor); width: 0; transition: width .2s; }

  .body { flex: 1; display: flex; min-height: 0; }
  main { flex: 1 1 60%; display: flex; align-items: center; justify-content: center;
         padding: 14px; min-height: 0; min-width: 0; position: relative; }
  main img { max-width: 100%; max-height: 100%; object-fit: contain;
             border-radius: 6px; background: #000; display: block; }
  .missing { color: var(--dim); text-align: center; max-width: 40em; }
  .missing code { color: var(--text); }

  /* Actor/recipient bbox highlight -- disambiguates 2+ same-category
     objects in one scene (e.g. two bowls), since obj_id alone has no
     visual meaning to the labeller. Positioned in JS from the stored
     pixel bbox, scaled to the <img>'s actual on-screen rendered rect
     (object-fit: contain can letterbox, so this can't just use % of the
     container). */
  .bbox { position: absolute; border: 3px solid; border-radius: 3px;
          pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .bbox.actor { border-color: var(--actor); }
  .bbox.recipient { border-color: var(--recipient); }
  .bbox .tag { position: absolute; top: -22px; left: -3px; font-size: 11px;
               font-weight: 600; padding: 1px 6px; border-radius: 3px;
               color: #0c0d0f; white-space: nowrap; }
  .bbox.actor .tag { background: var(--actor); }
  .bbox.recipient .tag { background: var(--recipient); }

  aside { flex: 0 0 380px; border-left: 1px solid var(--line);
          overflow-y: auto; padding: 10px; }
  .scene-id { color: var(--dim); font-size: 12px; padding: 4px 6px 10px; }
  .item { padding: 9px 10px; border-radius: 6px; margin-bottom: 4px;
          cursor: pointer; border: 1px solid transparent; font-size: 14px; }
  .item:hover { background: var(--panel); }
  .item.active { background: var(--panel); border-color: var(--actor); }
  .item.done { opacity: .45; }
  .item .a { color: #7dabf0; }
  .item .r { color: #f0a765; }
  .item .v { text-transform: uppercase; letter-spacing: .03em; color: var(--dim); font-size: 12px; }
  .item .score { float: right; font-variant-numeric: tabular-nums; color: var(--done); font-weight: 600; }

  footer { flex: none; border-top: 1px solid var(--line); padding: 12px 18px 16px; }
  .q { text-align: center; font-size: 22px; margin: 0 0 12px; }
  .q .a { color: #7dabf0; font-weight: 600; }
  .q .r { color: #f0a765; font-weight: 600; }
  .q .v { text-transform: uppercase; letter-spacing: .05em; }

  .keys { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .key { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
         padding: 7px 13px; color: var(--dim); font-size: 13px; }
  .key b { color: var(--text); }

  .overlay { position: fixed; inset: 0; background: rgba(8,9,11,.93);
             padding: 5vh 8vw; overflow: auto; display: none; }
  .overlay.show { display: block; }
  .overlay pre { white-space: pre-wrap; font: 14px/1.6 ui-monospace, monospace;
                 max-width: 78ch; margin: 0 auto; }
  .overlay h2 { max-width: 78ch; margin: 0 auto 1em; font-size: 17px; }

  #noteBox { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%);
             width: min(680px, 88vw); display: none; }
  #noteBox.show { display: block; }
  #noteBox textarea { width: 100%; height: 92px; background: var(--panel);
    color: var(--text); border: 1px solid var(--actor); border-radius: 6px;
    padding: 10px; font: inherit; resize: none; }
  #noteBox .hint { color: var(--dim); font-size: 12px; margin-top: 5px; }
  .done-screen { text-align: center; margin: auto; }

  #excludeBox { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%);
                width: min(680px, 88vw); display: none; }
  #excludeBox.show { display: block; }
  #excludeBox textarea { width: 100%; height: 72px; background: var(--panel);
    color: var(--text); border: 1px solid #d24f4f; border-radius: 6px;
    padding: 10px; font: inherit; resize: none; }
  #excludeBox .hint { color: var(--dim); font-size: 12px; margin-top: 5px; }
  #excludeBtn { border-color: #d24f4f; color: #e08a8a; }
</style>

<header>
  <span class="count" id="count">…</span>
  <span class="bar"><i id="bar"></i></span>
  <span class="count" id="eta"></span>
</header>

<div class="body">
  <main id="stage"></main>
  <aside id="sidebar"></aside>
</div>

<footer>
  <div class="q" id="question"></div>
  <div class="keys">
    <span class="key"><b>0</b>-<b>9</b> quality score (0=impossible, 9=perfect fit)</span>
    <span class="key"><b>U</b> unsure</span>
    <span class="key"><b>B</b> back (undo last judgement)</span>
    <span class="key"><b>&uarr;&darr;</b> pick item</span>
    <span class="key"><b>D</b> definition</span>
    <span class="key"><b>Space</b> note</span>
    <span class="key" id="excludeBtn" onclick="startExcludeScene()"><b>X</b> exclude scene</span>
  </div>
</footer>

<div class="overlay" id="defs"><h2 id="defTitle"></h2><pre id="defBody"></pre></div>
<div id="noteBox">
  <textarea id="noteText" placeholder="Note for this item — why it was borderline, render problem…"></textarea>
  <div class="hint">Enter to save · Esc to cancel</div>
</div>
<div id="excludeBox">
  <textarea id="excludeReason" placeholder="Why exclude this scene? (optional) — e.g. object severely occluded, unusable render…"></textarea>
  <div class="hint">Enter to exclude and move on · Esc to cancel</div>
</div>

<script>
let S = null, sceneIdx = 0, itemIdx = 0, shownAt = 0;
let conf = null, confExplicit = false, note = "";
const paceWindow = [];
const PACE_WINDOW_N = 20;
//: pair_ids judged THIS session, in order -- lets B step back to the
//: previous one and re-judge it as a revision (see manual_tool.py's own
//: `revision_of`, same mechanism, same append-only-not-delete rationale:
//: the original record stays on disk, a correction is a new record that
//: supersedes it by pair_id, not an edit-in-place).
const hist = [];
//: pair_id -> scene_id, recorded alongside hist -- goBack() needs this to
//: refetch a scene that's already dropped out of S.scenes (fully
//: completed) via /api/scene/<id>, since the pair_id alone doesn't say
//: which scene to ask the server for.
hist.sceneOf = {};

const $ = id => document.getElementById(id);
const scene = () => S.scenes[sceneIdx];
const item = () => scene().items[itemIdx];

function pretty(objId) { return String(objId).replace(/_/g, " "); }

function fmtDuration(sec) {
  if (!isFinite(sec) || sec < 0) return "—";
  const m = Math.round(sec / 60);
  if (m < 60) return `${m}m`;
  return `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}m`;
}

function updateEta() {
  if (!paceWindow.length) { $("eta").textContent = ""; return; }
  const avgMs = paceWindow.reduce((a, b) => a + b, 0) / paceWindow.length;
  const remaining = Math.max(S.total - S.done, 0);
  $("eta").textContent = `${(avgMs / 1000).toFixed(1)}s/item · ${fmtDuration(remaining * avgMs / 1000)} left`;
}

let totalScenes = 0, scenesDone = 0;

async function boot() {
  S = await (await fetch("/api/state")).json();
  // S.scenes only ever holds NOT-YET-FULLY-DONE scenes (server drops a
  // scene once every item in it is answered) and shrinks over the
  // session as advance() removes finished scenes -- capture the true
  // denominator once, here, so "scene N/M" stays a stable count of ALL
  // 500 scenes rather than "M" silently shrinking as you progress.
  scenesDone = S.total_scenes ? S.total_scenes - S.scenes.length : 0;
  totalScenes = S.total_scenes || S.scenes.length;
  if (!S.scenes.length) return showAllDone();
  // Land on the first not-fully-done scene's first not-done item.
  sceneIdx = 0;
  itemIdx = scene().items.findIndex(i => !i.done);
  if (itemIdx < 0) itemIdx = 0;
  render();
}

function showAllDone() {
  $("stage").innerHTML = '<div class="done-screen"><h2>All scenes complete</h2>' +
    '<p>Every judgement saved. You can close this tab.</p></div>';
  $("sidebar").innerHTML = "";
  $("question").textContent = "";
  $("count").textContent = `${S.total} / ${S.total}`;
  $("bar").style.width = "100%";
}

function render() {
  const sc = scene();
  $("count").textContent =
    `${S.done} / ${S.total} · scene ${scenesDone + sceneIdx + 1}/${totalScenes}`;
  $("bar").style.width = (100 * S.done / S.total).toFixed(1) + "%";
  updateEta();

  renderImage();
  renderSidebar();
  renderQuestion();

  conf = null; confExplicit = false; note = "";
  shownAt = performance.now();
  prefetchNextScene();
}

function renderImage() {
  const sc = scene();
  $("stage").innerHTML = `<img id="sceneImg" src="/img/${sc.image_path}" alt="" ` +
    `onerror="imgFail()" onload="drawBoxes()">`;
  window.onresize = drawBoxes;
}

function imgFail() {
  const sc = scene();
  $("stage").innerHTML =
    `<div class="missing"><p><b>Scene image missing.</b></p>` +
    `<p><code>${sc.image_path}</code> was not found.</p></div>`;
}

// Highlight the CURRENT item's actor/recipient with a colored box, matching
// the actor=blue/recipient=orange convention used everywhere else in the
// UI. Needed whenever a scene has 2+ instances of one category (two
// bowls, etc.) -- obj_id alone gives no visual way to tell them apart.
function drawBoxes() {
  const sc = scene();
  const img = $("sceneImg");
  if (!img || !sc.bboxes || !sc.image_size) return;
  document.querySelectorAll(".bbox").forEach(el => el.remove());

  // object-fit: contain can letterbox -- map pixel coords through the
  // actual rendered (not natural, not container) rect.
  const [natW, natH] = sc.image_size;
  const rect = img.getBoundingClientRect();
  const stageRect = $("stage").getBoundingClientRect();
  const scale = Math.min(rect.width / natW, rect.height / natH);
  const dispW = natW * scale, dispH = natH * scale;
  const offX = (rect.width - dispW) / 2 + (rect.left - stageRect.left);
  const offY = (rect.height - dispH) / 2 + (rect.top - stageRect.top);

  const it = item();
  const roles = [
    ["actor", it.actor.obj_id, "actor"],
    ["recipient", it.recipient.obj_id, "recipient"],
  ];
  for (const [role, objId, cls] of roles) {
    const box = sc.bboxes[objId];
    if (!box) continue;
    const [x1, y1, x2, y2] = box;
    const el = document.createElement("div");
    el.className = `bbox ${cls}`;
    el.style.left = `${offX + x1 * scale}px`;
    el.style.top = `${offY + y1 * scale}px`;
    el.style.width = `${(x2 - x1) * scale}px`;
    el.style.height = `${(y2 - y1) * scale}px`;
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = pretty(objId);
    el.appendChild(tag);
    $("stage").appendChild(el);
  }
}

function renderSidebar() {
  const sc = scene();
  const rows = sc.items.map((it, i) => {
    const verb = it.predicate.replace(/^can/, "");
    const cls = "item" + (i === itemIdx ? " active" : "") + (it.done ? " done" : "");
    // humanScore only exists for items judged THIS session (client-side
    // only, never round-tripped from the server) -- an item already done
    // from a prior session shows no score here, just the dimmed "done"
    // state, since the tool never reads scores back out of the session file.
    const scoreTag = it.humanScore !== undefined
      ? `<span class="score">${it.humanScore}</span>` : "";
    return `<div class="${cls}" data-i="${i}" onclick="jumpTo(${i})">` +
      `${scoreTag}<span class="v">${verb}</span><br>` +
      `<span class="a">${pretty(it.actor.obj_id)}</span> &rarr; ` +
      `<span class="r">${pretty(it.recipient.obj_id)}</span>` +
      `</div>`;
  }).join("");
  $("sidebar").innerHTML =
    `<div class="scene-id">${sc.scene_id} · ${sc.items.length} questions</div>${rows}`;
}

function renderQuestion() {
  const it = item();
  $("question").innerHTML =
    `How well can the <span class="a">${it.actor.obj_id.replace(/_\d+$/, "")}</span> ` +
    `<span class="v">${it.predicate.replace(/^can/, "")}</span> ` +
    `the <span class="r">${it.recipient.obj_id.replace(/_\d+$/, "")}</span>? ` +
    `(0 = impossible, 9 = perfect fit)`;
}

function jumpTo(i) {
  itemIdx = i;
  renderSidebar();
  renderQuestion();
  drawBoxes();
  conf = null; confExplicit = false; note = "";
  shownAt = performance.now();
}

// While the current scene is on screen, warm the browser's HTTP cache for
// the NEXT scene's image -- each /img/ hit can be a live SSH fetch
// server-side (--remote-host mode), so this hides that latency the same
// way manual_tool.html's prefetchNext() does for pair renders.
function prefetchNextScene() {
  const next = S.scenes[sceneIdx + 1];
  if (!next) return;
  new Image().src = `/img/${next.image_path}`;
}

async function judge(score) {
  const it = item();
  const isRevision = hist.includes(it.pair_id);
  const body = {
    pair_id: it.pair_id,
    scene_id: scene().scene_id,
    confidence: conf, confidence_explicit: confExplicit,
    note, elapsed_ms: Math.round(performance.now() - shownAt),
  };
  if (score === "unsure") body.verdict = "unsure";
  else body.human_score = score;
  if (isRevision) body.revision_of = it.pair_id;

  const r = await fetch("/api/judge", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  if (!r.ok) { alert("Save failed — not advancing. Check the terminal."); return; }

  it.done = true;
  it.humanScore = score === "unsure" ? "?" : score;
  if (!isRevision) {
    paceWindow.push(body.elapsed_ms);
    if (paceWindow.length > PACE_WINDOW_N) paceWindow.shift();
    S.done++;
    hist.push(it.pair_id);
    hist.sceneOf[it.pair_id] = scene().scene_id;
  }
  advance();
}

function advance() {
  const sc = scene();
  const nextItem = sc.items.findIndex((i, idx) => idx > itemIdx && !i.done);
  if (nextItem >= 0) {
    itemIdx = nextItem;
    render();
    return;
  }
  // Current scene exhausted -- drop it and move to the next not-done scene.
  scenesDone++;
  S.scenes.splice(sceneIdx, 1);
  if (sceneIdx >= S.scenes.length) sceneIdx = 0;
  if (!S.scenes.length) { showAllDone(); return; }
  itemIdx = S.scenes[sceneIdx].items.findIndex(i => !i.done);
  if (itemIdx < 0) itemIdx = 0;
  render();
}

// Step back to the most recently judged item (this session only -- items
// judged before a server restart aren't in `hist`) and let it be
// re-answered as a revision. If that item's scene was already dropped from
// S.scenes (fully completed and removed by advance()), it isn't
// re-inserted -- jumping to it via jumpTo still works because scene()/
// item() only need sceneIdx/itemIdx to point somewhere valid in the
// doc's original scene list, so this looks it up fresh from S.scenes by
// scene_id, re-adding the scene back into the active queue if needed.
async function goBack() {
  if (!hist.length) return;
  const pid = hist[hist.length - 1];
  let sIdx = S.scenes.findIndex(sc => sc.items.some(i => i.pair_id === pid));
  if (sIdx >= 0) {
    sceneIdx = sIdx;
    itemIdx = S.scenes[sIdx].items.findIndex(i => i.pair_id === pid);
    render();
    return;
  }
  // That item's scene was fully completed and already dropped from the
  // local queue by advance() -- fetch it fresh (even though it's 100%
  // done, /api/scene/<id> returns it unconditionally, unlike /api/state)
  // and re-insert it right after the current scene, so re-answering the
  // one item resumes the normal forward flow afterward instead of leaving
  // this scene stranded outside S.scenes again.
  const sceneId = hist.sceneOf ? hist.sceneOf[pid] : null;
  if (!sceneId) {
    alert("Can't go back further: don't know which scene that item belongs to.");
    return;
  }
  const r = await fetch(`/api/scene/${encodeURIComponent(sceneId)}`);
  if (!r.ok) {
    alert("Can't go back further: that scene could not be reloaded.");
    return;
  }
  const fetchedScene = await r.json();
  S.scenes.splice(sceneIdx + 1, 0, fetchedScene);
  sceneIdx = sceneIdx + 1;
  itemIdx = fetchedScene.items.findIndex(i => i.pair_id === pid);
  render();
}

// The whole current scene is unusable for a clean judgement (e.g. an
// object severely occluded behind another -- technically "visible" per the
// scene metadata but not actually identifiable, see
// docs/KNOWN_ISSUES.md). Excludes it from E3 round-4's ground truth
// entirely via /api/exclude_scene, with an optional free-text reason kept
// for audit (affdet/label/scene_tool.py's append_exclusion).
function startExcludeScene() {
  $("excludeReason").value = "";
  $("excludeBox").classList.add("show");
  $("excludeReason").focus();
}

async function submitExclude() {
  const sid = scene().scene_id;
  const reason = $("excludeReason").value;
  $("excludeBox").classList.remove("show");
  const r = await fetch("/api/exclude_scene", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ scene_id: sid, reason }),
  });
  if (!r.ok) { alert("Exclude failed — scene NOT removed. Check the terminal."); return; }

  S.scenes.splice(sceneIdx, 1);
  if (sceneIdx >= S.scenes.length) sceneIdx = 0;
  if (!S.scenes.length) { showAllDone(); return; }
  itemIdx = S.scenes[sceneIdx].items.findIndex(i => !i.done);
  if (itemIdx < 0) itemIdx = 0;
  render();
}

let lastKey = 0;
document.addEventListener("keydown", e => {
  if ($("excludeBox").classList.contains("show")) {
    if (e.key === "Escape") { $("excludeBox").classList.remove("show"); }
    else if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitExclude();
    }
    return;
  }
  if ($("noteBox").classList.contains("show")) {
    if (e.key === "Escape") { $("noteBox").classList.remove("show"); }
    else if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      note = $("noteText").value;
      $("noteBox").classList.remove("show");
    }
    return;
  }
  if ($("defs").classList.contains("show")) {
    if (e.key === "Escape" || e.key.toLowerCase() === "d")
      $("defs").classList.remove("show");
    return;
  }
  if (!S || !S.scenes.length) return;

  const k = e.key.toLowerCase();
  const isDigit = "0123456789".includes(k);
  if ((isDigit || k === "u") && performance.now() - lastKey < 150) return;

  if (isDigit) {
    lastKey = performance.now();
    judge(Number(k));
  } else if (k === "u") {
    lastKey = performance.now();
    judge("unsure");
  } else if (k === "b") {
    goBack();
  } else if (k === "x") {
    startExcludeScene();
  } else if (k === "d") {
    $("defTitle").textContent = item().predicate + " — " + item().question;
    $("defBody").textContent = item().definition;
    $("defs").classList.add("show");
  } else if (e.code === "Space") {
    e.preventDefault();
    $("noteText").value = note;
    $("noteBox").classList.add("show");
    $("noteText").focus();
  } else if (e.key === "ArrowDown") {
    e.preventDefault();
    const sc = scene();
    if (itemIdx < sc.items.length - 1) jumpTo(itemIdx + 1);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    if (itemIdx > 0) jumpTo(itemIdx - 1);
  }
});

boot();
</script>
